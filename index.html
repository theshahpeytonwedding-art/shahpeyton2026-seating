<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanvi & Robbie Seating Chart</title>
<style>
body{
    margin:0;
    font-family:'Georgia', serif;
    background:linear-gradient(to bottom,#5f6f87 0,#5f6f87 220px,#F7F3EF 220px);
    color:#55657E;
    min-height:100vh;
}
.banner{
    height:220px;
    background:transparent;
}
.container{
    max-width:900px;
    margin:-110px auto 50px auto;
    background:#ffffff;
    border-radius:36px;
    padding:50px 35px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    text-align:center;
}
h1{
    font-size:56px;
    letter-spacing:4px;
    color:#55657E;
    margin-bottom:10px;
}
h3{
    font-weight:400;
    letter-spacing:2px;
    color:#8C7B75;
}
.welcome{
    font-size:20px;
    color:#8C7B75;
    margin-bottom:25px;
}
input{
    width:min(85%,550px);
    padding:18px;
    font-size:18px;
    border-radius:18px;
    border:1px solid #DCCFC7;
    text-align:center;
    background:#FCFAF8;
}
.list{
    max-height:420px;
    overflow:auto;
    border:1px solid #ECE3DC;
    border-radius:18px;
    padding:20px;
    margin:30px auto 0;
    width:min(90%,650px);
    text-align:center;
    background:#FCFAF8;
}
.item{
    padding:12px;
    border-bottom:1px solid #EEE7E2;
}
.result{
    margin-top:30px;
    font-size:24px;
    color:#55657E;
    text-align:center;
}
.note{
    color:#9A8F89;
    font-size:14px;
}
</style>
</head>
<body>
<div class="banner"></div>

<div class="container">
<h1>TANVI & ROBBIE</h1>
<h3>Wedding Reception Seating Chart</h3><div class='welcome'>Find Your Seat & Let the Celebration Begin! ✨</div>

<p>Please search for your name or table number below.</p>
<p class="note">✨ Search "Table 5" or simply "5" to see everyone seated together.</p>

<input id="search" placeholder="Search by guest name or table number">

<div id="result" class="result"></div>

<h3 style="margin-top:40px;">Guest List</h3>
<div id="list" class="list">Loading...</div>
</div>

<script>
let guests=[];

async function loadData(){
 try {
   const response = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQgZTrigRqTNXJkP_B65F9tLm9UcAI68Clpng1Q1LXtbBntx79MYoLjXM0GAvthww/pub?output=csv&t=" + new Date().getTime());
   const text = await response.text();

   const rows = text.trim().split('\n').slice(1);

   guests = rows.map(r=>{
      const cols=r.split(',');
      return {
        name:(cols[0]||'').replace(/"/g,'').trim(),
        table:(cols[1]||'').replace(/"/g,'').trim()
      };
   }).filter(g=>g.name);

   renderList(guests);
 } catch(e) {
   document.getElementById('list').innerHTML='Unable to load guest list. Please refresh.';
 }
}

function renderList(list){
 document.getElementById('list').innerHTML =
 list.sort((a,b)=>a.name.localeCompare(b.name))
 .map(g=>`<div class="item">${g.name} — ${g.table}</div>`).join('');
}

document.getElementById('search').addEventListener('input', function(){
 const q=this.value.toLowerCase().trim();

 if(!q){
   document.getElementById('result').innerHTML='';
   renderList(guests);
   return;
 }

 const tableQuery = q.replace(/^table\s*/i, '').trim();

const matches = guests.filter(g => {
    const tableNumber = g.table.toLowerCase().replace(/^table\s*/i, '').trim();

    if (/^\d+$/.test(tableQuery)) {
        return tableNumber === tableQuery;
    }

    return g.name.toLowerCase().includes(q);
});

 if(matches.length && (q.includes('table') || /^\d+$/.test(q))){
   document.getElementById('result').innerHTML =
   `<b>${matches[0].table}</b><br><br>` +
   matches.map(g=>`✨ ${g.name}`).join('<br>');
 } else {
   document.getElementById('result').innerHTML =
   matches.length
   ? matches.map(g=>`✨ ${g.name}<br>${g.table}`).join('<br><br>')
   : 'No guest found.';
 }

 renderList(matches);
});

loadData();
</script>
</body>
</html>
